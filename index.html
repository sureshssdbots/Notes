<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Sc. B.Ed. Important Notes</title>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f2f5; padding-top: 50px; margin: 0; }
        .container { background: white; width: 80%; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .note-link { display: block; padding: 15px; margin: 10px 0; background: #3498db; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .note-link:hover { background: #2980b9; }

        /* Video Overlay */
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000;
        }
        video { width: 80%; height: 80%; margin-top: 5%; object-fit: contain; }
    </style>
</head>

<body onclick="showVideo()">

    <div class="container">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <p>Click anywhere to play video</p>
        
        <a href="physics.pdf" class="note-link">Physics Important Notes</a>
        <a href="maths.pdf" class="note-link">Maths/Calculus Important Notes</a>
        <a href="chemistry.pdf" class="note-link">Chemistry Important Notes</a>
    </div>

    <div id="videoOverlay" onclick="this.style.display='none'">
        <video id="myVideo" controls>
            <source src="welcome_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function showVideo() {
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            
            // Agar video pehle se visible nahi hai, toh dikhayein
            if (overlay.style.display !== "block") {
                overlay.style.display = "block";
                video.play();
            }
        }
    </script>
</body>
</html>
