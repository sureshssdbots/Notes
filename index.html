<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>B.Sc. B.Ed. Important Notes</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding-top: 50px; }
        .container { background: white; width: 80%; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Links button jaisa dikhega */
        .note-link { 
            display: block; padding: 15px; margin: 10px 0; background: #e74c3c; 
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; 
            cursor: pointer; 
        }

        /* Video Overlay */
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000;
        }
        video { width: 90%; height: 90%; margin-top: 2%; object-fit: contain; }
    </style>
</head>

<body onclick="playVideo()">

    <div class="container">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <p>Sabhi links video play karengi</p>
        
        <a class="note-link" onclick="playVideo(event)">Physics Important Notes</a>
        <a class="note-link" onclick="playVideo(event)">Maths/Calculus Important Notes</a>
        <a class="note-link" onclick="playVideo(event)">Chemistry Important Notes</a>
    </div>

    <div id="videoOverlay" onclick="closeVideo(event)">
        <video id="myVideo" controls>
            <source src="welcome_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function playVideo(event) {
            // Agar link par click kiya hai, toh browser ko PDF kholne se roke
            if(event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            
            overlay.style.display = "block";
            video.volume = 1.0; // Full volume set karna
            video.play();
        }

        function closeVideo(event) {
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            overlay.style.display = "none";
            video.pause();
        }
    </script>
</body>
</html>
