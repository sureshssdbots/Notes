<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Sc. B.Ed. Important Notes</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding-top: 30px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .container { background: white; width: 80%; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 24px; }
        .note-link { 
            display: block; padding: 12px; margin: 10px 0; background: #e74c3c; 
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000;
        }
        video { width: 90%; height: 80%; margin-top: 5%; }
        footer { margin-top: auto; padding: 20px; color: #777; font-size: 14px; }
    </style>
</head>

<body onclick="playVideo()">

    <div class="container">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <div class="note-link" onclick="playVideo(event)">Physics Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Maths/Calculus Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Chemistry Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Zoology Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Botany Important Notes</div>
    </div>

    <footer>Powered By SSD</footer>

    <div id="videoOverlay" onclick="closeVideo(event)">
        <video id="myVideo" controls>
            <source src="welcome_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function playVideo(event) {
            if(event) event.stopPropagation();
            
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            
            overlay.style.display = "block";
            video.muted = false; 
            video.volume = 1.0;  
            video.play().catch(function(error) {
                console.log("Interaction required to play with sound.");
            });
        }

        function closeVideo(event) {
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            overlay.style.display = "none";
            video.pause();
        }
    </script>
</body>
</html>
