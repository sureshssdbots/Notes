<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>B.Sc. B.Ed. Important Notes</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; text-align: center; 
            background: #121212; color: #ffffff; padding: 20px; 
            margin: 0; display: flex; flex-direction: column; min-height: 100vh;
        }
        .container { background: #1e1e1e; width: 90%; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #bb86fc; }
        .note-link { 
            display: block; padding: 15px; margin: 15px 0; background: #333; 
            color: #03dac6; text-decoration: none; border-radius: 8px; 
            font-weight: bold; border: 1px solid #444; transition: 0.3s;
        }
        .note-link:hover { background: #444; border-color: #03dac6; }
        footer { margin-top: auto; padding: 20px; font-size: 14px; color: #888; }
    </style>
</head>

<body onclick="startAudio()">

    <div class="container" onclick="startAudio()">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <p style="color: #aaa;">Click anywhere to start</p>
        
        <div class="note-link">Physics Important Notes</div>
        <div class="note-link">Maths/Calculus Important Notes</div>
        <div class="note-link">Chemistry Important Notes</div>
    </div>

    <audio id="myAudio">
        <source src="my_music.mp3" type="audio/mpeg">
    </audio>

    <footer>Powered By SSD</footer>

    <script>
        function startAudio() {
            var audio = document.getElementById("myAudio");
            // Volume force set karna
            audio.volume = 1.0; 
            
            var playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    console.log("Audio started");
                }).catch(error => {
                    console.log("Interaction required for audio");
                });
            }
        }
    </script>
</body>
</html>
