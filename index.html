<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>B.Sc. B.Ed. Important Notes</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding-top: 50px; }
        .container { background: white; width: 80%; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .note-link { 
            display: block; padding: 15px; margin: 10px 0; background: #e74c3c; 
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000;
        }
        video { width: 90%; height: 80%; margin-top: 5%; }
    </style>
</head>

<body onclick="playVideo()">

    <div class="container">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <div class="note-link" onclick="playVideo(event)">Physics Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Maths/Calculus Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Chemistry Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Zoology Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Botany part 1 Important Notes</div>
        <div class="note-link" onclick="playVideo(event)">Botany part 2 Important Notes</div>
    </div>

    <div id="videoOverlay" onclick="closeVideo(event)">
        <video id="myVideo" controls>
            <source src="welcome_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function playVideo(event) {
            if(event) event.stopPropagation(); // Click ko button tak simit rakhe
            
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            
            overlay.style.display = "block";
            video.muted = false; // Volume unmute force
            video.volume = 1.0;  // Full Volume
            video.play().catch(function(error) {
                console.log("Autoplay prevented, please click the play button on the video player.");
            });
        }

        function closeVideo(event) {
            var overlay = document.getElementById("videoOverlay");
            var video = document.getElementById("myVideo");
            overlay.style.display = "none";
            video.pause();
        }
    </script>
</body>
</html>
