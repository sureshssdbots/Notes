<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>B.Sc. B.Ed. Important Notes</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding-top: 50px; }
        .note-link { 
            display: block; padding: 15px; margin: 10px auto; background: #e74c3c; 
            width: 80%; color: white; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000;
        }
        /* Video Player ka size */
        video { width: 90%; height: 80%; margin-top: 5%; }
        
        /* Ek bada play button overlay par */
        #playButton {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; background: white; color: black;
            border-radius: 10px; cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>B.Sc. B.Ed. Important Notes</h1>
        <div class="note-link" onclick="showOverlay()">Physics Important Notes</div>
        <div class="note-link" onclick="showOverlay()">Maths/Calculus Important Notes</div>
        <div class="note-link" onclick="showOverlay()">Chemistry Important Notes</div>
    </div>

    <div id="videoOverlay">
        <div id="playButton" onclick="startVideo()">Play Video (Aawaz ke liye yahan click karein)</div>
        <video id="myVideo" controls>
            <source src="welcome_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function showOverlay() {
            document.getElementById("videoOverlay").style.display = "block";
        }

        function startVideo() {
            var video = document.getElementById("myVideo");
            var btn = document.getElementById("playButton");
            
            btn.style.display = "none"; // Button gayab ho jayega
            video.muted = false;       // Mute hat jayega
            video.volume = 1.0;        // Full volume
            video.play();              // Video play hoga
        }
    </script>
</body>
</html>
